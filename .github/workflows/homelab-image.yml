# Fork only: builds the homelab image (linux/amd64) from the `homelab` branch, which is an evcc release plus our
# patches. Bump TAG with each change: hs-01 pins the tag and digest.
name: Homelab Image

on:
  push:
    branches: [homelab]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/martin31821/evcc
  TAG: 0.319.0-forecast.1

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `make` reads the version from the latest tag
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: RELEASE=1
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/martin31821/evcc
          cache-from: type=gha
          cache-to: type=gha,mode=max
